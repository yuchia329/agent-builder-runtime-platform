openapi: 3.1.0
info:
  title: Control plane internal API
  version: 1.0.0
  description: |
    Calls from workers (and, from M4, the tool gateway) to the control plane (ADR 0001).
    Workers never read the control-plane table; they load a run and report its progress here.

    Run states (docs/product.md):

        QUEUED ─▶ RUNNING ─▶ WAITING_APPROVAL ─▶ (control plane re-queues) ─▶ QUEUED ─▶ RUNNING
                     │
                     ├─▶ SUCCEEDED
                     ├─▶ FAILED
                     └─▶ (set aside: POST .../defer) ─▶ QUEUED, re-queued after a delay

    Status changes a caller may request with PATCH:

    | From      | To                                            |
    | --------- | --------------------------------------------- |
    | QUEUED    | RUNNING                                       |
    | RUNNING   | RUNNING (progress, or resume after a crash)   |
    | RUNNING   | WAITING_APPROVAL, SUCCEEDED, FAILED           |

    Any other change returns 409. Moving WAITING_APPROVAL back to QUEUED after an approval, or to
    FAILED after a rejection (`approval_rejected`) or a timeout (`approval_expired`), is done by
    the control plane itself (ADR 0002), not through this API.

    Tenant limits (M8): each tenant has a cap on runs executing at once and a daily spend cap,
    checked when a run starts (QUEUED → RUNNING):

    - At the cap on runs at once, PATCH answers 429 with a `Deferred` problem and a
      `Retry-After` header. The control plane has already re-queued the run with that delay; the
      run stays QUEUED. The worker deletes its queue message and does nothing else.
    - Over the daily spend cap, the control plane moves the run to FAILED (`tenant_budget`) and
      PATCH answers 409 (the run is no longer QUEUED). The worker deletes its message.

    A run holds its slot while RUNNING and frees it when it ends, waits for an approval or is set
    aside. Resuming a RUNNING run after a crash (RUNNING → RUNNING) takes no new slot.

    Setting aside (M8): a worker that cannot go on for a while (the model provider keeps
    answering 429) calls POST /internal/runs/{run_id}/defer. The control plane moves the run from
    RUNNING to QUEUED and re-queues it after the delay; after 15 minutes set aside in total it
    moves the run to FAILED (`rate_limited`) instead. Time set aside is not working time, so it
    does not count against budget.max_seconds (ADR 0012).

    Approvals: once a pending call is decided, the control plane clears `pending_approval` and
    sets `approval` (the latest decision). A worker that picks the run up again makes the call it
    paused on only if `approval.decision` is `approved` and `step`, `tool` and `arguments` all
    equal that call; otherwise it pauses again.

    All requests are signed with AWS SigV4; API Gateway checks the signature (ADR 0007).

    Tracing (ADR 0022): each run has one trace, started by the control plane when it creates the
    run. Callers send the W3C `traceparent` header they got with the run (the queue message's
    `traceparent` attribute, see run-message.schema.json); the control plane's spans for the
    request join that trace. Only these internal routes honor `traceparent`.
servers:
  - url: /
    description: Same host as the public API (the API Gateway endpoint on AWS, or localhost:8080 locally)
security:
  - sigv4: []
tags:
  - name: runs
    description: Load a run and report its progress
paths:
  /internal/runs/{run_id}:
    parameters:
      - $ref: "#/components/parameters/RunId"
    get:
      operationId: getRun
      tags: [runs]
      summary: Load a run with its pinned spec version
      description: |
        Called by a worker after it receives a run message (contracts/run-message.schema.json).
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalRun"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateRun
      tags: [runs]
      summary: Report a run's status and progress
      description: |
        Sending the same update twice is safe: a RUNNING → RUNNING update only refreshes progress,
        and a repeated final update returns 409 without changing the run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunUpdate"
      responses:
        "200":
          description: The run after the update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The requested status change is not allowed from the run's current status. Also
            returned when a start was refused because the tenant is over its daily spend cap: the
            control plane has moved the run to FAILED (`tenant_budget`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/Deferred"

  /internal/runs/{run_id}/defer:
    parameters:
      - $ref: "#/components/parameters/RunId"
    post:
      operationId: deferRun
      tags: [runs]
      summary: Set a running run aside and re-queue it after a delay
      description: |
        For a RUNNING run only. The control plane moves it to QUEUED, frees its slot and
        re-queues it with `retry_after_seconds` as the delay, then answers with the run (QUEUED).
        If the run has been set aside for 15 minutes or more in total, it moves the run to FAILED
        (`rate_limited`) instead and answers with the FAILED run. Either way the worker deletes
        its queue message and releases its lease. Steps already checkpointed stay done: the run
        resumes after them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunDefer"
      responses:
        "200":
          description: The run after setting it aside (QUEUED), or FAILED if it waited too long
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The run is not RUNNING
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

components:
  securitySchemes:
    sigv4:
      type: apiKey
      name: Authorization
      in: header
      description: AWS Signature Version 4, signed with the caller's IAM role.
      x-amazon-apigateway-authtype: awsSigv4

  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/RunId"

  responses:
    BadRequest:
      description: The body is malformed or breaks a rule
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Missing or invalid SigV4 signature (returned by API Gateway)
    NotFound:
      description: No run with this id
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Deferred:
      description: |
        The tenant is at its cap on runs executing at once. The control plane has re-queued the
        run after `retry_after_seconds`; the run stays QUEUED and the caller drops its message.
      headers:
        Retry-After:
          description: Seconds until the run is delivered again (equal to retry_after_seconds).
          schema:
            type: integer
            minimum: 1
            maximum: 900
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/DeferredProblem"

  schemas:
    RunId:
      type: string
      minLength: 1
      maxLength: 64

    RunStatus:
      type: string
      enum: [QUEUED, RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED]

    Steps:
      description: Steps completed so far (model turns plus tool calls).
      type: integer
      minimum: 0

    CostUsd:
      description: Model cost so far, in US dollars.
      type: number
      minimum: 0

    TraceId:
      description: >-
        OpenTelemetry trace id of the run, set by the control plane when it creates the run (ADR
        0022). A caller's `trace_id` in PATCH is ignored once the run has one (runs created before
        tracing take it); workers stop sending it.
      type: string
      pattern: "^[0-9a-f]{32}$"

    Output:
      description: Final answer or summary of the run, when SUCCEEDED.
      type: string
      maxLength: 100000

    RunSummary:
      description: A run without its spec and input.
      allOf:
        - $ref: "#/components/schemas/RunFields"
      unevaluatedProperties: false

    RunFields:
      description: Fields shared by RunSummary and InternalRun. Open on purpose; each closes itself.
      type: object
      required: [run_id, tenant_id, agent_name, agent_version, status, steps, cost_usd,
                 created_at, updated_at]
      properties:
        run_id:
          $ref: "#/components/schemas/RunId"
        tenant_id:
          type: string
          minLength: 1
        agent_name:
          type: string
          minLength: 1
        agent_version:
          description: The spec version this run is pinned to.
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/RunStatus"
        steps:
          $ref: "#/components/schemas/Steps"
        cost_usd:
          $ref: "#/components/schemas/CostUsd"
        trace_id:
          $ref: "#/components/schemas/TraceId"
        pending_approval:
          $ref: "#/components/schemas/PendingApproval"
        approval:
          $ref: "#/components/schemas/ApprovalDecision"
        failure:
          $ref: "#/components/schemas/Failure"
        output:
          $ref: "#/components/schemas/Output"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    InternalRun:
      description: Everything a worker needs to execute a run.
      allOf:
        - $ref: "#/components/schemas/RunFields"
      unevaluatedProperties: false
      required: [spec, input]
      properties:
        spec:
          description: The exact published spec of agent_version.
          $ref: "agent-spec.schema.json"
        input:
          description: |
            What started the run: the trigger event payload (for example a GitHub webhook body),
            or the input given to POST /runs. Free-form.
          type: object
        run_token:
          description: |
            Signed JWT (ES256) the worker sends in the `X-Run-Token` header on every tool gateway
            call (ADR 0003; `Authorization` carries the SigV4 signature on AWS). Its claims follow run-token.schema.json. A new token on every GET,
            valid for the spec's budget.max_seconds from issue. Issued from M4; absent before
            then.
          type: string

    RunUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          description: The status to move to. See the allowed changes in the API description.
          type: string
          enum: [RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED]
        steps:
          $ref: "#/components/schemas/Steps"
        cost_usd:
          $ref: "#/components/schemas/CostUsd"
        trace_id:
          $ref: "#/components/schemas/TraceId"
        pending_approval:
          $ref: "#/components/schemas/PendingApproval"
        failure:
          $ref: "#/components/schemas/Failure"
        output:
          $ref: "#/components/schemas/Output"
      allOf:
        - if:
            properties: { status: { const: WAITING_APPROVAL } }
          then:
            required: [pending_approval]
          else:
            not: { required: [pending_approval] }
        - if:
            properties: { status: { const: FAILED } }
          then:
            required: [failure]
          else:
            not: { required: [failure] }
        - if:
            properties: { status: { not: { const: SUCCEEDED } } }
          then:
            not: { required: [output] }

    PendingApproval:
      description: The tool call waiting for a human decision (a tool in the spec's require_approval).
      type: object
      additionalProperties: false
      required: [step, tool, arguments]
      properties:
        step:
          description: Step number of the tool call.
          type: integer
          minimum: 1
        tool:
          type: string
          pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
        arguments:
          description: Arguments the model chose for the call.
          type: object

    ApprovalDecision:
      description: |
        The latest human decision on a pending call. Set by the control plane only; workers read
        it and never send it.
      type: object
      additionalProperties: false
      required: [step, tool, arguments, decision, decided_by, decided_at]
      properties:
        step:
          description: Step number of the decided call (equal to the pending call's).
          type: integer
          minimum: 1
        tool:
          type: string
          pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"
        arguments:
          description: Arguments of the decided call, exactly as they were pending.
          type: object
        decision:
          type: string
          enum: [approved, rejected]
        decided_by:
          description: Who decided, for example a Slack user id, or `api` for POST /runs/{id}/approval.
          type: string
          minLength: 1
          maxLength: 200
        decided_at:
          type: string
          format: date-time

    Failure:
      type: object
      additionalProperties: false
      required: [reason, message]
      properties:
        reason:
          type: string
          description: |
            approval_rejected, approval_expired, rate_limited (set aside for 15 minutes in total)
            and tenant_budget (tenant over its daily spend cap at start) are set by the control
            plane, never by a worker.
          enum: [budget_steps, budget_usd, budget_seconds, approval_rejected, approval_expired,
                 rate_limited, tenant_budget, error]
        message:
          description: Human-readable detail. Must not contain secrets.
          type: string
          maxLength: 2000

    RunDefer:
      description: Why and for how long a worker sets a running run aside.
      type: object
      additionalProperties: false
      required: [reason, retry_after_seconds]
      properties:
        reason:
          description: rate_limited = the model provider still answers 429 after the worker's retries.
          type: string
          enum: [rate_limited]
        retry_after_seconds:
          $ref: "#/components/schemas/DelaySeconds"

    DelaySeconds:
      description: Seconds before the run is delivered again (SQS DelaySeconds, at most 900).
      type: integer
      minimum: 1
      maximum: 900

    DeferredProblem:
      description: RFC 9457 problem details for a start refused for now (429).
      type: object
      required: [type, title, status, reason, retry_after_seconds]
      properties:
        type:
          const: "urn:agent-platform:problem:deferred"
        title: { type: string }
        status:
          const: 429
        detail: { type: string }
        reason:
          description: tenant_running_limit = the tenant is at its cap on runs executing at once.
          type: string
          enum: [tenant_running_limit]
        retry_after_seconds:
          $ref: "#/components/schemas/DelaySeconds"

    Problem:
      description: RFC 9457 problem details.
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
