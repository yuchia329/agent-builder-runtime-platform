spec: issue-triage
about: Spanish bug report, no duplicate
input:
  action: opened
  repository: {full_name: octocat/Hello-World}
  issue: {number: 20, title: La aplicación se cierra al abrir un archivo de vídeo grande, body: 'Cuando
      abro un vídeo de más de 2 GB, la aplicación se cierra sin mostrar ningún mensaje.'}
world:
  github:
    labels: [bug, enhancement, question, documentation, duplicate]
    issues:
    - number: 2
      title: Add dark mode
      body: A dark theme would be easier on the eyes at night.
      labels: [enhancement]
    - number: 3
      title: How do I change the interface language?
      body: I can't find the setting.
      labels: [question]
    - number: 4
      title: Typo in the installation guide
      body: Step 3 says 'instal' instead of 'install'.
      labels: [documentation]
    - number: 5
      title: Login button is misaligned on small screens
      body: On a 360 px wide phone the button overlaps the logo.
      labels: [bug]
    - number: 7
      title: Password reset email never arrives
      body: After requesting a password reset, no email arrives, also not in spam.
      labels: [bug]
    - number: 20
      title: La aplicación se cierra al abrir un archivo de vídeo grande
      body: Cuando abro un vídeo de más de 2 GB, la aplicación se cierra sin mostrar ningún mensaje.
      labels: []
checks:
- {status: SUCCEEDED}
- github:
    issue: 20
    labels: [bug]
    state: open
- tool_not_called: {tool: github.close_issue}
- output:
    matches: ['(?im)^\W*Label:\W*bug\b', '(?im)^\W*Duplicate of:\W*none', '(?im)^\W*Closed:\W*no']
- github:
    issue: 2
    labels: [enhancement]
    state: open
- github:
    issue: 3
    labels: [question]
    state: open
- github:
    issue: 4
    labels: [documentation]
    state: open
- github:
    issue: 5
    labels: [bug]
    state: open
- github:
    issue: 7
    labels: [bug]
    state: open
