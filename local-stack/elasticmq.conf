# ElasticMQ (local SQS). Queues below are created when the container starts.
include classpath("application.conf")

# Queue URLs are built from this address. Services run on the host in M0, so use localhost;
# when services move into compose (M0 last task) they need http://elasticmq:9324 instead.
node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}
generate-node-address = false

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

# Read-only queue statistics: http://localhost:9325/statistics/queues
rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  # Run queue: the control plane sends run ids, workers receive them (contracts/run-message.schema.json).
  runs {
    defaultVisibilityTimeout = 60 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "runs-dlq"
      maxReceiveCount = 5
    }
  }
  # Runs that failed 5 receives land here for inspection.
  runs-dlq {}
}
