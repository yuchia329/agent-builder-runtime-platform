spec: issue-triage
about: 'near-miss: password login fails, the existing issue is Google login'
input:
  action: opened
  repository: {full_name: octocat/Hello-World}
  issue: {number: 20, title: Login with email and password fails after the update, body: 'Since version
      3.1, entering my correct email and password shows ''invalid credentials''.'}
world:
  github:
    labels: [bug, enhancement, question, documentation, duplicate]
    issues:
    - number: 2
      title: Add dark mode
      body: A dark theme would be easier on the eyes at night.
      labels: [enhancement]
    - number: 3
      title: How do I change the interface language?
      body: I can't find the setting.
      labels: [question]
    - number: 4
      title: Typo in the installation guide
      body: Step 3 says 'instal' instead of 'install'.
      labels: [documentation]
    - number: 5
      title: Login button is misaligned on small screens
      body: On a 360 px wide phone the button overlaps the logo.
      labels: [bug]
    - number: 8
      title: Login with Google fails with error 400
      body: The Google sign-in popup closes and shows error 400.
      labels: [bug]
    - number: 20
      title: Login with email and password fails after the update
      body: Since version 3.1, entering my correct email and password shows 'invalid credentials'.
      labels: []
checks:
- {status: SUCCEEDED}
- github:
    issue: 20
    labels: [bug]
    state: open
- tool_not_called: {tool: github.close_issue}
- output:
    matches: ['(?im)^\W*Label:\W*bug\b', '(?im)^\W*Duplicate of:\W*none', '(?im)^\W*Closed:\W*no']
- github:
    issue: 2
    labels: [enhancement]
    state: open
- github:
    issue: 3
    labels: [question]
    state: open
- github:
    issue: 4
    labels: [documentation]
    state: open
- github:
    issue: 5
    labels: [bug]
    state: open
- github:
    issue: 8
    labels: [bug]
    state: open
