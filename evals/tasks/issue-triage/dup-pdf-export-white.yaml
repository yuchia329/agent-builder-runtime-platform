spec: issue-triage
about: 'true duplicate: exported PDF is all white'
input:
  action: opened
  repository: {full_name: octocat/Hello-World}
  issue: {number: 20, title: Exported PDF is completely white, body: 'When I export my document to PDF,
      every page in the file is empty. The document itself shows text and images.'}
world:
  github:
    labels: [bug, enhancement, question, documentation, duplicate]
    issues:
    - number: 2
      title: Add dark mode
      body: A dark theme would be easier on the eyes at night.
      labels: [enhancement]
    - number: 3
      title: How do I change the interface language?
      body: I can't find the setting.
      labels: [question]
    - number: 4
      title: Typo in the installation guide
      body: Step 3 says 'instal' instead of 'install'.
      labels: [documentation]
    - number: 5
      title: Login button is misaligned on small screens
      body: On a 360 px wide phone the button overlaps the logo.
      labels: [bug]
    - number: 6
      title: PDF export shows blank pages
      body: Every page of the exported PDF is white although the document has content.
      labels: [bug]
    - number: 7
      title: Password reset email never arrives
      body: After requesting a password reset, no email arrives, also not in spam.
      labels: [bug]
    - number: 20
      title: Exported PDF is completely white
      body: When I export my document to PDF, every page in the file is empty. The document itself shows
        text and images.
      labels: []
checks:
- {status: SUCCEEDED}
- github:
    issue: 20
    labels: [bug, duplicate]
    state: closed
    state_reason: duplicate
    duplicate_of: 6
- tool_called:
    tool: github.close_issue
    arguments: {issue_number: 20, state_reason: duplicate, duplicate_of: 6}
- output:
    matches: ['(?im)^\W*Label:\W*bug\b', '(?im)^\W*Duplicate of:\W*#6\b', '(?im)^\W*Closed:\W*yes']
- github:
    issue: 2
    labels: [enhancement]
    state: open
- github:
    issue: 3
    labels: [question]
    state: open
- github:
    issue: 4
    labels: [documentation]
    state: open
- github:
    issue: 5
    labels: [bug]
    state: open
- github:
    issue: 6
    labels: [bug]
    state: open
- github:
    issue: 7
    labels: [bug]
    state: open
