spring:
  application:
    name: control-plane
  main:
    banner-mode: off
  autoconfigure:
    # aws-serverless-java-container brings this; it would replace Tomcat everywhere. On Lambda the
    # handler registers its own server factory (ADR 0017), so it is never needed.
    exclude: org.springframework.cloud.function.serverless.web.ServerlessAutoConfiguration
  jackson:
    # One JSON style across the platform (contracts use snake_case); absent beats null.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

platform:
  store-backend: ${STORE_BACKEND:memory}
  table: ${CONTROL_PLANE_TABLE:control-plane}
  queue-backend: ${QUEUE_BACKEND:memory}
  run-queue-url: ${RUN_QUEUE_URL:}
  tenant:
    id: ${TENANT_ID:tenant-demo}
    api-key: ${TENANT_API_KEY:}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  sweep:
    interval-seconds: ${SWEEP_INTERVAL_SECONDS:60}
    queued-after-seconds: ${SWEEP_QUEUED_AFTER_SECONDS:300}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
    approval-channel: ${SLACK_APPROVAL_CHANNEL:}
    api-url: ${SLACK_API_URL:https://slack.com/api}
    signing-secret: ${SLACK_SIGNING_SECRET:}
  approval:
    timeout-hours: ${APPROVAL_TIMEOUT_HOURS:72}
  run-token:
    private-key: ${RUN_TOKEN_PRIVATE_KEY:}
    public-key: ${RUN_TOKEN_PUBLIC_KEY:}
    # On AWS: sign with this KMS key instead of the pair above (ADR 0018).
    kms-key-id: ${RUN_TOKEN_KMS_KEY_ID:}
  # Secrets (TENANT_API_KEY, GITHUB_WEBHOOK_SECRET, SLACK_BOT_TOKEN, SLACK_SIGNING_SECRET): from the
  # values above (env), or on AWS from SSM parameters under the path, read on first use (ssm).
  secrets:
    source: ${SECRETS_SOURCE:env}
    ssm-path: ${SECRETS_SSM_PATH:}
