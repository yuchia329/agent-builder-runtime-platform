spec: issue-triage
about: German report of an existing English issue (password reset email)
input:
  action: opened
  repository: {full_name: octocat/Hello-World}
  issue: {number: 20, title: E-Mail zum Zurücksetzen des Passworts kommt nie an, body: 'Ich habe mehrmals
      ein neues Passwort angefordert, aber keine E-Mail erhalten, auch nicht im Spam-Ordner.'}
world:
  github:
    labels: [bug, enhancement, question, documentation, duplicate]
    issues:
    - number: 2
      title: Add dark mode
      body: A dark theme would be easier on the eyes at night.
      labels: [enhancement]
    - number: 3
      title: How do I change the interface language?
      body: I can't find the setting.
      labels: [question]
    - number: 4
      title: Typo in the installation guide
      body: Step 3 says 'instal' instead of 'install'.
      labels: [documentation]
    - number: 5
      title: Login button is misaligned on small screens
      body: On a 360 px wide phone the button overlaps the logo.
      labels: [bug]
    - number: 7
      title: Password reset email never arrives
      body: After requesting a password reset, no email arrives, also not in spam.
      labels: [bug]
    - number: 20
      title: E-Mail zum Zurücksetzen des Passworts kommt nie an
      body: Ich habe mehrmals ein neues Passwort angefordert, aber keine E-Mail erhalten, auch nicht im
        Spam-Ordner.
      labels: []
checks:
- {status: SUCCEEDED}
- github:
    issue: 20
    labels: [bug, duplicate]
    state: closed
    state_reason: duplicate
    duplicate_of: 7
- tool_called:
    tool: github.close_issue
    arguments: {issue_number: 20, state_reason: duplicate, duplicate_of: 7}
- output:
    matches: ['(?im)^\W*Label:\W*bug\b', '(?im)^\W*Duplicate of:\W*#7\b', '(?im)^\W*Closed:\W*yes']
- github:
    issue: 2
    labels: [enhancement]
    state: open
- github:
    issue: 3
    labels: [question]
    state: open
- github:
    issue: 4
    labels: [documentation]
    state: open
- github:
    issue: 5
    labels: [bug]
    state: open
- github:
    issue: 7
    labels: [bug]
    state: open
