[project]
name = "contracts"
version = "0.0.0"
description = "Schema checks for the shared contracts"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "openapi-spec-validator>=0.7",
    "pyyaml>=6.0",
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
