spring:
  application:
    name: control-plane
  main:
    banner-mode: off
  jackson:
    # One JSON style across the platform (contracts use snake_case); absent beats null.
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

platform:
  store-backend: ${STORE_BACKEND:memory}
  table: ${CONTROL_PLANE_TABLE:control-plane}
  queue-backend: ${QUEUE_BACKEND:memory}
  run-queue-url: ${RUN_QUEUE_URL:}
  tenant:
    id: ${TENANT_ID:tenant-demo}
    api-key: ${TENANT_API_KEY:}
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  sweep:
    interval-seconds: ${SWEEP_INTERVAL_SECONDS:60}
    queued-after-seconds: ${SWEEP_QUEUED_AFTER_SECONDS:300}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
    approval-channel: ${SLACK_APPROVAL_CHANNEL:}
    api-url: ${SLACK_API_URL:https://slack.com/api}
