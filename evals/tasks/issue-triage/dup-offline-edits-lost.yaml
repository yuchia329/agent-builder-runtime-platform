spec: issue-triage
about: 'true duplicate: offline edits lost on reconnect'
input:
  action: opened
  repository: {full_name: octocat/Hello-World}
  issue: {number: 20, title: Offline edits disappear when wifi comes back, body: 'I edited three notes
      on the train without a connection. When my phone reconnected, the edits were gone.'}
world:
  github:
    labels: [bug, enhancement, question, documentation, duplicate]
    issues:
    - number: 2
      title: Add dark mode
      body: A dark theme would be easier on the eyes at night.
      labels: [enhancement]
    - number: 3
      title: How do I change the interface language?
      body: I can't find the setting.
      labels: [question]
    - number: 4
      title: Typo in the installation guide
      body: Step 3 says 'instal' instead of 'install'.
      labels: [documentation]
    - number: 5
      title: Login button is misaligned on small screens
      body: On a 360 px wide phone the button overlaps the logo.
      labels: [bug]
    - number: 8
      title: Changes made offline are lost after reconnecting
      body: Anything edited while offline is overwritten by the server copy once the app is online again.
      labels: [bug]
    - number: 20
      title: Offline edits disappear when wifi comes back
      body: I edited three notes on the train without a connection. When my phone reconnected, the edits
        were gone.
      labels: []
checks:
- {status: SUCCEEDED}
- github:
    issue: 20
    labels: [bug, duplicate]
    state: closed
    state_reason: duplicate
    duplicate_of: 8
- tool_called:
    tool: github.close_issue
    arguments: {issue_number: 20, state_reason: duplicate, duplicate_of: 8}
- output:
    matches: ['(?im)^\W*Label:\W*bug\b', '(?im)^\W*Duplicate of:\W*#8\b', '(?im)^\W*Closed:\W*yes']
- github:
    issue: 2
    labels: [enhancement]
    state: open
- github:
    issue: 3
    labels: [question]
    state: open
- github:
    issue: 4
    labels: [documentation]
    state: open
- github:
    issue: 5
    labels: [bug]
    state: open
- github:
    issue: 8
    labels: [bug]
    state: open
