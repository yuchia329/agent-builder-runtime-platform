[project]
name = "evals"
version = "0.0.1"
description = "Agent evals: run a spec's tasks against simulated services and check its decisions"
requires-python = ">=3.12"
dependencies = [
    "worker",           # handle_run, the model adapters and GatewayTools (ADR 0016)
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0",
]

[tool.uv.sources]
worker = { path = "../worker", editable = true }

[project.scripts]
evals = "evals.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
