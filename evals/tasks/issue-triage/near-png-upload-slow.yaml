spec: issue-triage
about: 'near-miss: large PNG upload is slow, the existing issue is a crash'
input:
  action: opened
  repository: {full_name: octocat/Hello-World}
  issue: {number: 20, title: Uploading a large PNG takes over a minute, body: 'Uploading a 6 MB PNG works,
      but the progress bar takes more than a minute. Small files upload instantly.'}
world:
  github:
    labels: [bug, enhancement, question, documentation, duplicate]
    issues:
    - number: 2
      title: Add dark mode
      body: A dark theme would be easier on the eyes at night.
      labels: [enhancement]
    - number: 3
      title: How do I change the interface language?
      body: I can't find the setting.
      labels: [question]
    - number: 4
      title: Typo in the installation guide
      body: Step 3 says 'instal' instead of 'install'.
      labels: [documentation]
    - number: 5
      title: Login button is misaligned on small screens
      body: On a 360 px wide phone the button overlaps the logo.
      labels: [bug]
    - number: 8
      title: Crash when uploading a large PNG
      body: Uploading a PNG bigger than 5 MB makes the app crash.
      labels: [bug]
    - number: 20
      title: Uploading a large PNG takes over a minute
      body: Uploading a 6 MB PNG works, but the progress bar takes more than a minute. Small files upload
        instantly.
      labels: []
checks:
- {status: SUCCEEDED}
- tool_called:
    tool: github.add_label
    arguments: {issue_number: 20}
- github:
    issue: 20
    labels_exclude: [duplicate, question, documentation]
    state: open
- tool_not_called: {tool: github.close_issue}
- output:
    matches: ['(?im)^\W*Closed:\W*no']
- github:
    issue: 2
    labels: [enhancement]
    state: open
- github:
    issue: 3
    labels: [question]
    state: open
- github:
    issue: 4
    labels: [documentation]
    state: open
- github:
    issue: 5
    labels: [bug]
    state: open
- github:
    issue: 8
    labels: [bug]
    state: open
