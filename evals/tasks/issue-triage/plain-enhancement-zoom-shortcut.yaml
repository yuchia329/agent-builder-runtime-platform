spec: issue-triage
about: 'feature request, no duplicate: keyboard shortcut for zoom to fit'
input:
  action: opened
  repository: {full_name: octocat/Hello-World}
  issue: {number: 20, title: Add a keyboard shortcut for zoom to fit, body: Fitting the canvas to the
      window needs three clicks today. A shortcut like Shift+1 would help.}
world:
  github:
    labels: [bug, enhancement, question, documentation, duplicate]
    issues:
    - number: 2
      title: Add dark mode
      body: A dark theme would be easier on the eyes at night.
      labels: [enhancement]
    - number: 3
      title: How do I change the interface language?
      body: I can't find the setting.
      labels: [question]
    - number: 4
      title: Typo in the installation guide
      body: Step 3 says 'instal' instead of 'install'.
      labels: [documentation]
    - number: 5
      title: Login button is misaligned on small screens
      body: On a 360 px wide phone the button overlaps the logo.
      labels: [bug]
    - number: 6
      title: PDF export shows blank pages
      body: Every page of the exported PDF is white although the document has content.
      labels: [bug]
    - number: 20
      title: Add a keyboard shortcut for zoom to fit
      body: Fitting the canvas to the window needs three clicks today. A shortcut like Shift+1 would help.
      labels: []
checks:
- {status: SUCCEEDED}
- github:
    issue: 20
    labels: [enhancement]
    state: open
- tool_not_called: {tool: github.close_issue}
- output:
    matches: ['(?im)^\W*Label:\W*enhancement\b', '(?im)^\W*Duplicate of:\W*none', '(?im)^\W*Closed:\W*no']
- github:
    issue: 2
    labels: [enhancement]
    state: open
- github:
    issue: 3
    labels: [question]
    state: open
- github:
    issue: 4
    labels: [documentation]
    state: open
- github:
    issue: 5
    labels: [bug]
    state: open
- github:
    issue: 6
    labels: [bug]
    state: open
