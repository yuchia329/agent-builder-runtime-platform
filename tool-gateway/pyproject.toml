[project]
name = "tool-gateway"
version = "0.0.1"
description = "Holds credentials and runs agent tool calls over MCP (ADR 0006)"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "mcp>=2.3.0",
    "pyjwt[crypto]>=2.15.1",
    "starlette>=1.10.0",
    "uvicorn>=0.38",
]

[project.scripts]
gateway = "gateway.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]
