# GitHub connector (ADR 0014; format: contracts/connector-allowlist.schema.json).
# Operations come from openapi.yaml (cut from GitHub's official description); checks the rules
# cannot express are hooks in hooks.py.
connector: github
base_url: https://api.github.com
headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
credentials:
  team-bot: github_app
  owner: oauth
hook_operations:
  - issues/list-labels-for-repo
  - issues/get
tools:
  github.search_issues:
    operation: search/issues-and-pull-requests
    description: >-
      Search issues in the allowed repositories (the repositories are added for you). Search
      matches exact words, not other forms of them: use one or two distinctive words, or join
      forms with OR ("crash OR crashes"). Returns number, title, state, labels and url; no bodies.
    arguments:
      q:
        max_length: 256
        refuse_pattern: '(?i)\b(repo|org|user|owner):'
        refuse_message: "Do not use repo:, org:, user: or owner:; the repositories are added for you."
        append: " is:issue"
        scope_qualifiers: { qualifier: repo, setting: GITHUB_REPOS }
    fixed: { per_page: 10 }
    result:
      list: items
      fields: { number: number, title: title, state: state, labels: "labels[].name", url: html_url }
    annotations: { readOnlyHint: true, idempotentHint: true }
    hook: search_results_in_allowed_repos
  github.add_label:
    operation: issues/add-labels
    description: >-
      Add one existing label to an issue (labels holds exactly one name). Returns the issue's
      labels.
    arguments:
      owner: {}
      repo: {}
      issue_number: {}
      labels: { max_items: 1 }
    checks:
      - value: "{owner}/{repo}"
        in_setting: GITHUB_REPOS
        ignore_case: true
        message: "Repository '{value}' is not allowed."
    result:
      list: "."
      fields: { name: name }
    annotations: { readOnlyHint: false, idempotentHint: true }  # adding an existing label changes nothing
    hook: existing_labels_only
  github.close_issue:
    operation: issues/update
    description: >-
      Close an issue. state_reason: completed (fixed or done), not_planned (won't do) or
      duplicate (then give duplicate_of, the number of the original issue in the same
      repository). Closing an issue that is already closed changes nothing.
    arguments:
      owner: {}
      repo: {}
      issue_number: {}
      state_reason: { enum: [completed, not_planned, duplicate] }
    fixed: { state: closed }
    checks:
      - value: "{owner}/{repo}"
        in_setting: GITHUB_REPOS
        ignore_case: true
        message: "Repository '{value}' is not allowed."
    result:
      fields:
        issue_number: number
        state: state
        state_reason: state_reason
        already_closed: already_closed
        url: html_url
        duplicate_of: duplicate_of
    annotations: { readOnlyHint: false, idempotentHint: true, destructiveHint: true }  # a closed issue is reported, not re-closed
    hook: close_issue_checks
    hook_arguments:
      duplicate_of:
        type: integer
        minimum: 1
        description: Number of the original issue in the same repository (state_reason duplicate only).
