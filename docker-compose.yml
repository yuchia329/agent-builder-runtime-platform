# The whole platform locally: AWS stand-ins (DynamoDB Local, ElasticMQ) plus the control plane,
# tool gateway and worker built from this repo. Start with `make up`; `make stack` starts only the AWS stand-ins.
# Data is in memory: `make down` (or a restart) wipes it.
name: agent-platform

services:
  dynamodb:
    image: amazon/dynamodb-local:3.3.2
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports:
      - "9324:9324" # SQS API
      - "9325:9325" # queue statistics
    volumes:
      - ./local-stack/elasticmq.conf:/opt/elasticmq.conf:ro

  # One-off: creates the control-plane and run-state tables, then exits. Also used by `make status`.
  aws-init:
    image: amazon/aws-cli:2.40.4
    depends_on:
      - dynamodb
      - elasticmq
    entrypoint: ["sh", "/local-stack/create-tables.sh"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      AWS_PAGER: ""
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
      CONTROL_PLANE_TABLE: ${CONTROL_PLANE_TABLE:-control-plane}
      STATE_TABLE: ${STATE_TABLE:-run-state}
    volumes:
      - ./control-plane/dynamodb:/defs/control-plane:ro
      - ./worker/dynamodb:/defs/worker:ro
      - ./local-stack:/local-stack:ro
    restart: "no"

  # Built from control-plane/Dockerfile. Only its own settings (make service-env), never the
  # whole .env (no GITHUB_TOKEN, model key or gateway secrets; ADR 0006), with container addresses.
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    # Run-token key pair from `make` (local-stack/run-token-keys.sh).
    env_file: [.control-plane.env, .run-token-private.env, .run-token-public.env]
    environment:
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
      RUN_QUEUE_URL: http://elasticmq:9324/000000000000/runs
    ports:
      - "8080:8080"
    depends_on:
      aws-init:
        condition: service_completed_successfully
    healthcheck:
      # Up when the internal API answers (404 for an unknown run is fine).
      test: ["CMD-SHELL", "curl -s -o /dev/null localhost:8080/internal/runs/healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Fake GitHub API for `make chaos` only (profile chaos: `make up` does not start it).
  fake-github:
    image: python:3.12.8-slim
    profiles: ["chaos"]
    command: ["python", "-u", "/local-stack/fake-github.py"]
    environment:
      SEARCH_DELAY_SECONDS: "8"
    ports:
      - "8099:8099"
    volumes:
      - ./local-stack:/local-stack:ro

  # Built from tool-gateway/Dockerfile. Gets only what it needs, never the whole .env (no
  # GITHUB_TOKEN, Slack or model secrets): the public run-token key, the connectors, and the
  # GitHub App settings (key file mounted read-only when GITHUB_APP_PRIVATE_KEY_FILE is set).
  # CONNECTORS=fake (default) for `make demo`; CONNECTORS=github in .env for real runs.
  tool-gateway:
    build:
      context: .
      dockerfile: tool-gateway/Dockerfile
    env_file: [.run-token-public.env]
    environment:
      CONNECTORS: ${CONNECTORS:-fake}
      CONTROL_PLANE_URL: http://control-plane:8080
      GITHUB_REPOS: ${GITHUB_REPOS:-}
      TENANT_ID: ${TENANT_ID:-tenant-demo}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY_FILE: ${GITHUB_APP_PRIVATE_KEY_FILE:+/run/secrets/github-app.pem}
      # Owner login for acts_as owner (ADR 0015): all three or none; unset = owner runs refused.
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:-}
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8090}
    volumes:
      - ${GITHUB_APP_PRIVATE_KEY_FILE:-/dev/null}:/run/secrets/github-app.pem:ro
    ports:
      - "8090:8090"
    depends_on:
      control-plane:
        condition: service_healthy

  # Built from worker/Dockerfile: polls the run queue; tools always through the gateway (M4).
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # Only the worker's own settings (make service-env), never the whole .env (ADR 0006).
    env_file: .worker.env
    environment:
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb:8000
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
      RUN_QUEUE_URL: http://elasticmq:9324/000000000000/runs
      CONTROL_PLANE_URL: http://control-plane:8080
      TOOLS_PROVIDER: mcp
      TOOL_GATEWAY_URL: http://tool-gateway:8090
      GITHUB_TOKEN: "" # only the gateway holds credentials (ADR 0006); chaos sets a fake one
    depends_on:
      control-plane:
        condition: service_healthy
      tool-gateway:
        condition: service_healthy
