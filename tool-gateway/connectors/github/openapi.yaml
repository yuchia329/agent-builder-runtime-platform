# Cut by scripts/cut_openapi.py on 2026-11-18 from
# https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.json
# (version 1.1.4). Do not edit by hand; re-run.
openapi: 3.0.3
info:
  title: GitHub v3 REST API
  version: 1.1.4
servers:
- url: https://api.github.com
paths:
  /repos/{owner}/{repo}/issues/{issue_number}:
    get:
      summary: Get an issue
      description: 'The API returns a [`301 Moved Permanently` status](https://docs.github.com/rest/guides/best-practices-for-using-the-rest-api#follow-redirects)
        if the issue was

        [transferred](https://docs.github.com/articles/transferring-an-issue-to-another-repository/) to
        another repository. If

        the issue was transferred to or deleted from a repository where the authenticated user lacks read
        access, the API

        returns a `404 Not Found` status. If the issue was deleted from a repository where the authenticated
        user has read

        access, the API returns a `410 Gone` status. To receive webhook events for transferred and deleted
        issues, subscribe

        to the [`issues`](https://docs.github.com/webhooks/event-payloads/#issues) webhook.


        > [!NOTE]

        > GitHub''s REST API considers every pull request an issue, but not every issue is a pull request.
        For this reason, "Issues" endpoints may return both issues and pull requests in the response.
        You can identify pull requests by the `pull_request` key. Be aware that the `id` of a pull request
        returned from "Issues" endpoints will be an _issue id_. To find out the pull request id, use the
        "[List pull requests](https://docs.github.com/rest/pulls/pulls#list-pull-requests)" endpoint.


        This endpoint supports the following custom media types. For more information, see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response will include
        `body`. This is the default if you do not pass any specific media type.

        - **`application/vnd.github.text+json`**: Returns a text only representation of the markdown body.
        Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s markdown. Response
        will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations. Response
        will include `body`, `body_text`, and `body_html`.'
      tags:
      - issues
      operationId: issues/get
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/issues#get-an-issue
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/issue-number'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue'
              examples:
                default:
                  summary: Issue
                  value:
                    $ref: '#/components/examples/issue'
                pinned_comment:
                  summary: Issue with pinned comment
                  value:
                    $ref: '#/components/examples/issue-with-pinned-comment'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
        '304':
          $ref: '#/components/responses/not_modified'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: issues
    patch:
      summary: Update an issue
      description: 'Issue owners and users with push access or Triage role can edit an issue.


        This endpoint supports the following custom media types. For more information, see "[Media types](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types)."


        - **`application/vnd.github.raw+json`**: Returns the raw markdown body. Response will include
        `body`. This is the default if you do not pass any specific media type.

        - **`application/vnd.github.text+json`**: Returns a text only representation of the markdown body.
        Response will include `body_text`.

        - **`application/vnd.github.html+json`**: Returns HTML rendered from the body''s markdown. Response
        will include `body_html`.

        - **`application/vnd.github.full+json`**: Returns raw, text, and HTML representations. Response
        will include `body`, `body_text`, and `body_html`.'
      tags:
      - issues
      operationId: issues/update
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/issues#update-an-issue
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/issue-number'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  oneOf:
                  - type: string
                  - type: integer
                  description: The title of the issue.
                  nullable: true
                body:
                  type: string
                  description: The contents of the issue.
                  nullable: true
                assignee:
                  type: string
                  nullable: true
                  description: Username to assign to this issue. **This field is closing down.**
                state:
                  type: string
                  description: The open or closed state of the issue.
                  enum:
                  - open
                  - closed
                status:
                  type: string
                  description: The status to give the issue. Can be `Backlog`, `Todo`, `In progress`,
                    `In review`, `Done`, `Not planned`, or `Duplicate`. If omitted, the current status
                    is preserved unless `state` or `state_reason` changes. Setting a status also updates
                    `state` and `state_reason` as needed. If provided, `state` and `state_reason` must
                    be consistent with the requested status. Changing the status to `Duplicate` requires
                    `duplicate_issue_id`. Cannot be `null` or an empty string. The status and other applied
                    field changes are saved together. If the status cannot be saved, those field changes
                    are rolled back. Ignored when issue statuses aren't available in the repository. Issue
                    statuses are in preview and only available to accounts enrolled in the preview.
                  example: In progress
                state_reason:
                  type: string
                  enum:
                  - completed
                  - not_planned
                  - duplicate
                  - reopened
                  nullable: true
                  description: The reason for the state change. Ignored unless `state` is changed.
                  example: not_planned
                duplicate_issue_id:
                  type: integer
                  description: 'The ID of the issue that this issue duplicates, used when marking this
                    issue as a duplicate with `status: Duplicate` or `state_reason: duplicate`. The issue
                    must exist and be accessible to the authenticated user.'
                milestone:
                  oneOf:
                  - type: string
                  - type: integer
                    description: The `number` of the milestone to associate this issue with or use `null`
                      to remove the current milestone. Only users with push access can set the milestone
                      for issues. Without push access to the repository, milestone changes are silently
                      dropped.
                  nullable: true
                labels:
                  type: array
                  description: Labels to associate with this issue. Pass one or more labels to _replace_
                    the set of labels on this issue. Send an empty array (`[]`) to clear all labels from
                    the issue. Only users with push access can set labels for issues. Without push access
                    to the repository, label changes are silently dropped.
                  items:
                    oneOf:
                    - type: string
                    - type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                          nullable: true
                        color:
                          type: string
                          nullable: true
                        rationale:
                          type: string
                          description: Optional reasoning for selecting this label.
                        suggest:
                          type: boolean
                          description: If `true`, the change is stored as a pending suggestion for human
                            review rather than applied directly.
                        confidence:
                          type: string
                          description: The confidence level for this label choice.
                          enum:
                          - low
                          - medium
                          - high
                assignees:
                  type: array
                  description: Usernames to assign to this issue. Pass one or more user logins to _replace_
                    the set of assignees on this issue. Send an empty array (`[]`) to clear all assignees
                    from the issue. Only users with push access can set assignees for new issues. Without
                    push access to the repository, assignee changes are silently dropped.
                  items:
                    oneOf:
                    - type: string
                    - type: object
                      properties:
                        login:
                          type: string
                        rationale:
                          type: string
                          description: Optional reasoning for selecting this assignee.
                        suggest:
                          type: boolean
                          description: If `true`, the change is stored as a pending suggestion for human
                            review rather than applied directly.
                        confidence:
                          type: string
                          description: The confidence level for this assignee choice.
                          enum:
                          - low
                          - medium
                          - high
                issue_field_values:
                  type: array
                  description: An array of issue field values to set on this issue. Each field value must
                    include the field ID and the value to set. Only users with push access can set field
                    values for issues
                  items:
                    type: object
                    properties:
                      field_id:
                        type: integer
                        description: The ID of the issue field to set
                      value:
                        oneOf:
                        - type: string
                        - type: number
                        - type: array
                          items:
                            type: string
                        description: The value to set for the field. For multi-select fields, provide
                          an array of option names.
                      rationale:
                        type: string
                        description: Optional reasoning for setting this field value.
                      suggest:
                        type: boolean
                        description: If `true`, the change is stored as a pending suggestion for human
                          review rather than applied directly.
                      confidence:
                        type: string
                        description: The confidence level for this field value choice.
                        enum:
                        - low
                        - medium
                        - high
                    required:
                    - field_id
                    - value
                    additionalProperties: false
                type:
                  description: The issue type to associate with this issue. Only users with push access
                    can set the type for issues. Without push access to the repository, type changes are
                    silently dropped.
                  nullable: true
                  oneOf:
                  - type: string
                    description: The name of the issue type.
                    example: Epic
                  - type: object
                    description: The issue type with optional metadata.
                    properties:
                      value:
                        type: string
                        description: The name of the issue type to associate with this issue, or `null`
                          to remove the current issue type.
                        nullable: true
                        example: Epic
                      rationale:
                        type: string
                        description: Optional reasoning for selecting this type.
                      suggest:
                        type: boolean
                        description: If `true`, the change is stored as a pending suggestion for human
                          review rather than applied directly.
                      confidence:
                        type: string
                        description: The confidence level for this type choice.
                        enum:
                        - low
                        - medium
                        - high
            examples:
              default:
                value:
                  title: Found a bug
                  body: I'm having a problem with this.
                  assignees:
                  - octocat
                  milestone: 1
                  state: open
                  labels:
                  - bug
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/issue'
                - type: object
                  properties:
                    suggestions:
                      type: object
                      description: 'Pending suggestions for each suggestible field (`type`,

                        `issue_field_values`, `labels`, `assignees`, `state`) the

                        request touched. Omitted for fields not in the request or

                        with no pending or ignored suggestions. Items tagged

                        `ignored` are echoes of the current request''s inputs that

                        were not persisted as pending suggestions.

                        '
                      properties:
                        type:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        issue_field_values:
                          type: array
                          items:
                            type: object
                            properties:
                              field_id:
                                type: integer
                              value:
                                oneOf:
                                - type: string
                                - type: number
                                - type: array
                                  items:
                                    type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        labels:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        assignees:
                          type: array
                          items:
                            type: object
                            properties:
                              login:
                                type: string
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
                        state:
                          type: array
                          items:
                            type: object
                            properties:
                              value:
                                type: string
                              state_reason:
                                type: string
                              duplicate_issue_id:
                                type: integer
                              rationale:
                                type: string
                              suggest:
                                type: boolean
                              confidence:
                                type: string
                                enum:
                                - low
                                - medium
                                - high
                              ignored:
                                type: boolean
                              ignored_reason:
                                type: string
                                enum:
                                - already_applied
                                - issue_already_closed
              examples:
                default:
                  $ref: '#/components/examples/issue'
        '422':
          $ref: '#/components/responses/validation_failed'
        '503':
          $ref: '#/components/responses/service_unavailable'
        '403':
          $ref: '#/components/responses/forbidden'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: issues
      x-github-breaking-changes:
      - changeset: remove_singular_assignee_from_issues_and_pull_requests
        patch:
          requestBody:
            content:
              application/json:
                schema:
                  properties:
                    assignee: null
        version: '2026-03-10'
  /repos/{owner}/{repo}/issues/{issue_number}/labels:
    post:
      summary: Add labels to an issue
      description: Adds labels to an issue.
      tags:
      - issues
      operationId: issues/add-labels
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/labels#add-labels-to-an-issue
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/issue-number'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  labels:
                    type: array
                    minItems: 1
                    description: The labels to add to the issue's existing labels. You can also pass an
                      `array` of labels directly, but GitHub recommends passing an object with the `labels`
                      key. To replace all of the labels for an issue, use "[Set labels for an issue](https://docs.github.com/rest/issues/labels#set-labels-for-an-issue)."
                    items:
                      oneOf:
                      - type: string
                      - type: object
                        properties:
                          name:
                            type: string
                            description: The name of the label to add.
                          rationale:
                            type: string
                            description: Optional reasoning for adding this label.
                          suggest:
                            type: boolean
                            description: If `true`, the label is stored as a pending suggestion for human
                              review rather than applied directly.
                          confidence:
                            type: string
                            description: The confidence level for this label choice.
                            enum:
                            - low
                            - medium
                            - high
                        required:
                        - name
              - type: array
                items:
                  type: string
              - type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    rationale:
                      type: string
                      description: Optional reasoning for adding this label.
                    suggest:
                      type: boolean
                      description: If `true`, the label is stored as a pending suggestion for human review
                        rather than applied directly.
                    confidence:
                      type: string
                      description: The confidence level for this label choice.
                      enum:
                      - low
                      - medium
                      - high
                  required:
                  - name
            examples:
              default:
                value:
                  labels:
                  - bug
                  - enhancement
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/label'
              examples:
                default:
                  $ref: '#/components/examples/label-items'
        '301':
          $ref: '#/components/responses/moved_permanently'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
        '422':
          $ref: '#/components/responses/validation_failed'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: labels
  /repos/{owner}/{repo}/labels:
    get:
      summary: List labels for a repository
      description: Lists all labels for a repository.
      tags:
      - issues
      operationId: issues/list-labels-for-repo
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/issues/labels#list-labels-for-a-repository
      parameters:
      - $ref: '#/components/parameters/owner'
      - $ref: '#/components/parameters/repo'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/label'
              examples:
                default:
                  $ref: '#/components/examples/label-items'
          headers:
            Link:
              $ref: '#/components/headers/link'
        '404':
          $ref: '#/components/responses/not_found'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: issues
        subcategory: labels
  /search/issues:
    get:
      summary: Search issues and pull requests
      description: 'Find issues by state and keyword. This method returns up to 100 results [per page](https://docs.github.com/rest/guides/using-pagination-in-the-rest-api).


        When searching for issues, you can get text match metadata for the issue **title**, issue **body**,
        and issue **comment body** fields when you pass the `text-match` media type. For more details
        about how to receive highlighted

        search results, see [Text match metadata](https://docs.github.com/rest/search/search#text-match-metadata).


        For example, if you want to find the oldest unresolved Python bugs on Windows. Your query might
        look something like this.


        `q=windows+label:bug+language:python+state:open&sort=created&order=asc`


        This query searches for the keyword `windows`, within any open issue that is labeled as `bug`.
        The search runs across repositories whose primary language is Python. The results are sorted by
        creation date in ascending order, which means the oldest issues appear first in the search results.


        > [!NOTE]

        > For requests made by GitHub Apps with a user access token, you can''t retrieve a combination
        of issues and pull requests in a single query. Requests that don''t include the `is:issue` or
        `is:pull-request` qualifier will receive an HTTP `422 Unprocessable Entity` response. To get results
        for both issues and pull requests, you must send separate queries for issues and pull requests.
        For more information about the `is` qualifier, see "[Searching only issues or pull requests](https://docs.github.com/github/searching-for-information-on-github/searching-issues-and-pull-requests#search-only-issues-or-pull-requests)."'
      tags:
      - search
      operationId: search/issues-and-pull-requests
      externalDocs:
        description: API method documentation
        url: https://docs.github.com/rest/search/search#search-issues-and-pull-requests
      parameters:
      - name: q
        description: The query contains one or more search keywords and qualifiers. Qualifiers allow you
          to limit your search to specific areas of GitHub. The REST API supports the same qualifiers
          as the web interface for GitHub. To learn more about the format of the query, see [Constructing
          a search query](https://docs.github.com/rest/search/search#constructing-a-search-query). See
          "[Searching issues and pull requests](https://docs.github.com/search-github/searching-on-github/searching-issues-and-pull-requests)"
          for a detailed list of qualifiers.
        in: query
        required: true
        schema:
          type: string
      - name: sort
        description: 'Sorts the results of your query by the number of `comments`, `reactions`, `reactions-+1`,
          `reactions--1`, `reactions-smile`, `reactions-thinking_face`, `reactions-heart`, `reactions-tada`,
          or `interactions`. You can also sort results by how recently the items were `created` or `updated`,
          Default: [best match](https://docs.github.com/rest/search/search#ranking-search-results)'
        in: query
        required: false
        schema:
          type: string
          enum:
          - comments
          - reactions
          - reactions-+1
          - reactions--1
          - reactions-smile
          - reactions-thinking_face
          - reactions-heart
          - reactions-tada
          - interactions
          - created
          - updated
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/per-page'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/issues-advanced-search'
      - $ref: '#/components/parameters/search-type'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: object
                required:
                - total_count
                - incomplete_results
                - items
                - search_type
                properties:
                  total_count:
                    type: integer
                  incomplete_results:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/issue-search-result-item'
                  search_type:
                    type: string
                    description: The type of search that was performed. Possible values are `lexical`,
                      `semantic`, or `hybrid`.
                    enum:
                    - lexical
                    - semantic
                    - hybrid
                  lexical_fallback_reason:
                    type: array
                    description: When a semantic or hybrid search falls back to lexical search, this field
                      contains the reasons for the fallback. Only present when a fallback occurred.
                    items:
                      type: string
                      enum:
                      - no_text_terms
                      - quoted_text
                      - non_issue_target
                      - or_boolean_not_supported
                      - no_accessible_repos
                      - server_error
                      - only_non_semantic_fields_requested
                      - service_unavailable
              examples:
                default:
                  $ref: '#/components/examples/issue-search-result-item-paginated'
                lexical-fallback:
                  $ref: '#/components/examples/issue-search-result-item-paginated-lexical-fallback'
        '503':
          $ref: '#/components/responses/service_unavailable'
        '422':
          $ref: '#/components/responses/validation_failed'
        '304':
          $ref: '#/components/responses/not_modified'
        '403':
          $ref: '#/components/responses/forbidden'
        '401':
          $ref: '#/components/responses/requires_authentication'
      x-github:
        githubCloudOnly: false
        enabledForGitHubApps: true
        category: search
        subcategory: search
