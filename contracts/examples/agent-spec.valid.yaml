# Demo agent: GitHub issue triage. Sample spec used by tests and local demos.
# The final version is written in the M1 [specs] task.
name: issue-triage
model: stub/demo
instructions: >
  Triage new issues for the payments repo. Search for duplicates, add labels,
  and post a short summary to Slack. Never close an issue without approval.
trigger: github.issue.opened
acts_as: team-bot
tools:
  - github.search_issues
  - github.add_label
  - github.close_issue
  - slack.post_message
require_approval: [github.close_issue]
budget: { max_steps: 20, max_usd: 0.10, max_seconds: 300 }
