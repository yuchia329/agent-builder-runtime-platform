[project]
name = "loadtest"
version = "0.0.1"
description = "Load driver against the AWS dev deployment: stub model, fake connector (M7, M8)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "httpx>=0.28.1",
]

[project.scripts]
loadtest = "loadtest.cli:main"
loadtest-limits = "loadtest.limits_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
